name: ci

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_call:

# 同じ PR の古い実行は打ち切る (workflow_call のときは deploy 側の concurrency に従う)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 検査ごとに別のジョブにして、PR にどれが落ちたかを名前で出す。1 つ落ちても残りを走らせ、直す箇所を 1 回で全部出す
  check:
    if: ${{ !github.event.pull_request.draft }}
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task: [type-check, lint, format-check, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.task }}

  # 必須チェックはこの 1 つ。検査を増やしてもルールセットを変えずに済み、列挙し忘れで素通りすることもない。
  # always() で必ず走らせる (needs が落ちると既定では飛ばされ、飛ばされたチェックは成功扱いになる)
  ci:
    if: ${{ always() }}
    needs: check
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
