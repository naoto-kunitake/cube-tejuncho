pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,ts,tsx}'
      run: pnpm eslint --fix --max-warnings 0 {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{js,ts,tsx,json,css,yml,yaml,html}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    type-check:
      run: pnpm type-check
