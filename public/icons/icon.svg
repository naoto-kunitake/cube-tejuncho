      <rect x="28" y="120" width="80" height="80" rx="14"/><rect x="120" y="120" width="80" height="80" rx="14"/><rect x="212" y="120" width="80" height="80" rx="14"/>
      <rect x="28" y="212" width="80" height="80" rx="14"/><rect x="120" y="212" width="80" height="80" rx="14"/><rect x="212" y="212" width="80" height="80" rx="14"/>
